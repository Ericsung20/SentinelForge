<!--
  Centralized config for the "default" agent group.
  Deployed to the manager at /var/ossec/etc/shared/default/agent.conf and pushed to agents automatically.
-->
<agent_config os="Windows">
  <!-- Sysmon events (config: telemetry/sysmon/sysmonconfig.xml). Decoded by Wazuh's built-in Sysmon rules. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
