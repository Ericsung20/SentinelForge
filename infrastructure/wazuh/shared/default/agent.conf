<!--
  Centralized config for the "default" agent group.
  Deployed to the manager at /var/ossec/etc/shared/default/agent.conf and pushed to agents automatically.
-->
<agent_config os="Windows">
  <!-- Sysmon events (config: telemetry/sysmon/sysmonconfig.xml). Decoded by Wazuh's built-in Sysmon rules. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell script block logging (4104), enabled by telemetry/windows-events/Set-AuditPolicy.ps1.
       The Security channel (4624, 4688, 4698, ...) is already collected by the agent's default config. -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Defender: 5007 configuration changed (e.g. exclusions added from the Windows Security UI, which
       Sysmon and command-line rules miss), 1116/1117 malware detected/actioned. -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
